version: 2

updates:
  # Basis-Images in Dockerfiles
  - package-ecosystem: "docker"
    directories: ["/", "/**"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(docker)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Image-Tags in docker-compose.yml
  - package-ecosystem: "docker-compose"
    directories: ["/", "/**"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(docker)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
